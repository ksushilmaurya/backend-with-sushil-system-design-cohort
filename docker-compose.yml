
services:
  api1:
    build: ./app
    environment:
      INSTANCE_ID: backend-1

  api2:
    build: ./app
    environment:
      INSTANCE_ID: backend-2

  api3:
    build: ./app
    environment:
      INSTANCE_ID: backend-3

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3