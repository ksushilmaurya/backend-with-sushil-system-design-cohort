
events {}

http {
    upstream backend_pool {
        server api1:3000;
        server api2:3000;
        server api3:3000;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backend_pool;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
